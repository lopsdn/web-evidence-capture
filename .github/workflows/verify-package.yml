name: Verify Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Python syntax
        run: python -m compileall src tests
      - name: Shell syntax
        run: bash -n bin/publish-snapshot
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Validate examples against schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          pairs = [
              ("schemas/case.schema.json", "examples/sample-output/manifest/package-metadata.json"),
              ("schemas/capture-config.schema.json", "examples/minimal-config.json"),
              ("schemas/url-inventory.schema.json", "examples/sample-output/manifest/url-inventory.json"),
              ("schemas/capture-result.schema.json", "examples/sample-output/manifest/capture-result.json"),
              ("schemas/render-result.schema.json", "examples/sample-output/manifest/render-result.json"),
              ("schemas/file-manifest.schema.json", "examples/sample-output/manifest/file-manifest.json"),
              ("schemas/evidence-summary.schema.json", "examples/sample-output/manifest/evidence-summary.json"),
              ("schemas/validation.schema.json", "examples/sample-output/validation/validation.json"),
          ]
          for schema_path, data_path in pairs:
              schema = json.loads(Path(schema_path).read_text())
              data = json.loads(Path(data_path).read_text())
              Draft202012Validator(schema).validate(data)
          PY
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(path.read_text())
          PY
      - name: Sensitive literal scan
        run: |
          python - <<'PY'
          from pathlib import Path
          from web_evidence_capture.sensitive_scan import scan_tree
          findings = scan_tree(Path("."))
          if findings:
              raise SystemExit(findings)
          PY
