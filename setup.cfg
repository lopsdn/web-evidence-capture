[metadata]
name = web-evidence-capture
version = 0.1.0
description = Reusable public-web evidence capture and preservation tooling.
author = Daniel Lopes
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    jinja2>=3.1
    jsonschema>=4.0
    playwright>=1.40
    PyYAML>=6.0
    requests>=2.31
    warcio>=1.7
    wacz>=0.5

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    web-evidence = web_evidence_capture.cli:main

